services:
  - type: web
    name: certindo-worksheet-api
    runtime: node
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm db:generate && pnpm --filter @certindo/api build
    startCommand: pnpm --filter @certindo/api start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: API_PORT
        value: 10000
      - key: CORS_ORIGINS
        sync: false
      - key: STORAGE_DRIVER
        value: blob
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: TEMPLATE_EARLY_URL
        sync: false
      - key: TEMPLATE_CURRENT_URL
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
